name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps

    - name: Install and validate
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze check-public --ns algebra.maybe --summary-only
        calcit calcit.cirru analyze check-types --summary-only --format json
        calcit calcit.cirru analyze weak-types --only schema-dynamic,unresolved-type-slot,code-dynamic --intent unresolved --summary-only --format json
        calcit calcit.cirru analyze deprecated --summary-only --format json
        calcit calcit.cirru analyze dynamic-methods --format json
        calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Test native and JavaScript backends
      run: |
        calcit calcit.cirru test --require-match
        mode=ci calcit calcit.cirru
        calcit calcit.cirru js
        mode=ci node main.mjs
