name: Tests

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@v6.5.0
      with:
        node-version: 24

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.18.0 --activate

    - uses: calcit-lang/setup-calcit@v1.5.0
      with:
        tools: calcit,caps
        deps-file: deps.cirru
        caps-version: 0.1.1

    - name: Install and validate
      run: |
        caps --strict --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --quiet --exit-code -- calcit.cirru
        calcit calcit.cirru --check-only --all-defs
        calcit calcit.cirru fix --workflow strict --verify
        calcit calcit.cirru --check-only --ns algebra.maybe --summary-only --format edn
        calcit calcit.cirru analyze weak-types --only coverage --summary-only --format edn
        calcit calcit.cirru analyze weak-types --only deprecated-call --summary-only --format edn
        calcit calcit.cirru docs format-md README.md --check
        calcit calcit.cirru docs check-md README.md --failures-only

    - name: Test native and JavaScript backends
      run: |
        calcit calcit.cirru test --require-match
        mode=ci calcit calcit.cirru
        calcit calcit.cirru js
        mode=ci node main.mjs
